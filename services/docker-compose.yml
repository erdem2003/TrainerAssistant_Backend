# Yerel geliştirme ortamı — tek komutla ayağa kalkar.
#
#   cp .env.example .env
#   ./infra/generate-keys.sh
#   docker compose up --build
#
# ADR 0005'in pratik sonucu: her servisin KENDİ veritabanı var. Tek Postgres
# örneği çalışıyor ama içinde ayrı veritabanları açılıyor ve her servis yalnızca
# kendisininkine bağlanıyor. Üretimde ayrı örneklere bölmek yalnızca bağlantı
# dizesi değiştirmek demek — sınır kod tarafında zaten var.

name: trainer-asistant

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trainer}
      POSTGRES_DB: postgres
    ports:
      # 15433 bilinçli: geliştiricinin makinesinde zaten bir Postgres (5432/5433) olabilir ve
      # 5432 çakışması ilk denemede anlaşılması zor bir hata üretir.
      - "15433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      # Servisler Postgres hazır olmadan başlarsa ilk migration çöker.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trainer} -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Redpanda — Kafka API'siyle uyumlu broker (ADR 0006, Phase 11).
  #
  # ★ NEDEN APACHE KAFKA DEGIL ★
  # Redpanda tek binary: ZooKeeper ya da KRaft yapilandirmasi yok, JVM yok,
  # birkac saniyede ayaga kalkiyor. Istemci tarafi Kafka protokolu oldugu icin
  # uretimde gercek Kafka'ya gecmek yalnizca `KAFKA_BOOTSTRAP` degistirmek —
  # kod tarafinda hicbir sey degismez.
  #
  # `--overprovisioned` ve tek partition: gelistirme makinesinde Redpanda
  # varsayilan olarak butun CPU'yu rezerve etmeye calisiyor.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
      # Host'tan `rpk` ile bakabilmek icin.
      - "19092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-16380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: ./auth-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trainer}:${POSTGRES_PASSWORD:-trainer}@postgres:5432/auth_db
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: auth-service
      JWT_PRIVATE_KEY_PATH: /run/keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}

      # --- Hiz sinirlari: GELISTIRME icin gevsetildi ---
      #
      # `app/config.py`'deki VARSAYILANLAR DEGISMEDI ve uretim degerleri
      # onlar (kayit 3/saat, giris 5/dk). Gevsetme yalnizca burada, compose
      # dosyasinda; uretime cikarken bu blok SILINIR ve kod varsayilanlari
      # geri gelir.
      #
      # Neden kodu degistirmedim: bu sayilar kaba kuvvet savunmasi. Kodun
      # icinde gevsetilseydi "gelistirme icin" notu zamanla unutulur ve
      # uretime gevsek deger giderdi.
      LOGIN_PER_EMAIL_PER_MINUTE: ${LOGIN_PER_EMAIL_PER_MINUTE:-30}
      LOGIN_PER_IP_PER_MINUTE: ${LOGIN_PER_IP_PER_MINUTE:-120}
      REGISTER_PER_EMAIL_PER_HOUR: ${REGISTER_PER_EMAIL_PER_HOUR:-50}
      REGISTER_PER_IP_PER_HOUR: ${REGISTER_PER_IP_PER_HOUR:-200}
      # Gmail'in gunluk gonderim sinirini (kisisel hesapta ~500) zorlamamak
      # icin tamamen kaldirilmadi, 60 sn'den 10 sn'ye indirildi.
      RESEND_COOLDOWN_SECONDS: ${RESEND_COOLDOWN_SECONDS:-10}
      RESEND_PER_EMAIL_PER_HOUR: ${RESEND_PER_EMAIL_PER_HOUR:-50}
    ports:
      - "18001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Geliştirmede canlı yeniden yükleme: imajı yeniden derlemeden kod değişir.
      - ./auth-service/app:/srv/app:ro
      - ./auth-service/migrations:/srv/migrations:ro
      # Anahtarlar salt okunur bağlanıyor ve imaja GÖMÜLMÜYOR — imaj paylaşılsa
      # bile private key sızmaz.
      - ./infra/keys:/run/keys:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # user-service — kullanici profili (ADR 0005: olculer, kalibrasyon, tercihler).
  #
  # KENDI VERITABANI VAR (`user_db`) ve auth_db'ye ERISIMI YOK. Baglanti dizesi
  # tek basina bu siniri kuruyor: yanlislikla baska bir tabloya sorgu atmak
  # mumkun degil, cunku o tablo bu baglantidan gorunmuyor.
  #
  # Redis YOK: hiz siniri gateway'de, bu servis oturum/sayac tutmuyor.
  user-service:
    build:
      context: ./user-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trainer}:${POSTGRES_PASSWORD:-trainer}@postgres:5432/user_db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: user-service
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    ports:
      # Gelistirmede gateway'i atlayarak dogrudan test edebilmek icin.
      # Uretimde bu yayin KALDIRILIR — tek dis kapi gateway olmali.
      - "18002:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./user-service/app:/srv/app:ro
      - ./user-service/migrations:/srv/migrations:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # workout-service — antrenman kaydi (ADR 0005).
  #
  # Kendi veritabani `workout_db`. Egzersiz katalogu da burada bir tablo:
  # ADR 0005 ayri bir exercise-service'i reddetti (statik veri, sifir fayda).
  workout-service:
    build:
      context: ./workout-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trainer}:${POSTGRES_PASSWORD:-trainer}@postgres:5432/workout_db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: workout-service
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    ports:
      # Gelistirmede gateway'i atlayarak test etmek icin. Uretimde KALDIRILIR.
      - "18003:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./workout-service/app:/srv/app:ro
      - ./workout-service/migrations:/srv/migrations:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # workout-outbox-relay — workout-service'in IKINCI SURECI, ayri servis degil.
  #
  # Ayni imaj, ayni veritabani, farkli entrypoint — `auth-email-worker` ile
  # birebir ayni desen. Ayri bir servis SAYILMAZ (ADR 0005'in bes bileseni
  # degismedi); yalnizca HTTP istek yolundan ayrilmis bir arka plan isi.
  #
  # Neden ayri surec: Kafka yavassa ya da ayakta degilse antrenman KAYDI
  # etkilenmemeli. Yayin istek icinde yapilsaydi Kafka kritik yola girerdi ve
  # outbox deseninin varlik sebebi ortadan kalkardi.
  workout-outbox-relay:
    build:
      context: ./workout-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trainer}:${POSTGRES_PASSWORD:-trainer}@postgres:5432/workout_db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: workout-outbox-relay
      KAFKA_BOOTSTRAP: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      workout-service:
        # Şemayı workout-service'in migration'ı kuruyor; relay ondan sonra.
        condition: service_started
    volumes:
      - ./workout-service/app:/srv/app:ro
    command: python -m app.worker.outbox_relay

  # analytics-service — olay akisindan turetilen OKUMA MODELI (ADR 0006).
  #
  # ★ ADR 0005'IN BESINCI BILESENI ★ Phase 10'da "sirada" diye birakilmisti;
  # tuketecegi olay akisi olmadan kurulmasi anlamsizdi.
  #
  # `workout_db`'ye HIC DOKUNMUYOR — verinin tamami Kafka'dan geliyor. Sinirin
  # gercekten korundugunun kaniti da bu: baglanti dizesi yalnizca analytics_db.
  analytics-service:
    build:
      context: ./analytics-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trainer}:${POSTGRES_PASSWORD:-trainer}@postgres:5432/analytics_db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: analytics-service
      KAFKA_BOOTSTRAP: redpanda:9092
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    ports:
      - "18005:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./analytics-service/app:/srv/app:ro
      - ./analytics-service/migrations:/srv/migrations:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # analytics-consumer — analytics-service'in IKINCI SURECI.
  #
  # `REPLAY_MODE=true` ile calistirilirsa `processed_events` kontrolu atlanir ve
  # akis guncel mantikla bastan yeniden yansitilir (Phase 11 cikis kriteri):
  #   docker compose exec redpanda rpk group delete analytics-workout-v1
  #   docker compose run --rm -e REPLAY_MODE=true analytics-consumer
  analytics-consumer:
    build:
      context: ./analytics-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trainer}:${POSTGRES_PASSWORD:-trainer}@postgres:5432/analytics_db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: analytics-consumer
      KAFKA_BOOTSTRAP: redpanda:9092
      REPLAY_MODE: ${REPLAY_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    volumes:
      - ./analytics-service/app:/srv/app:ro
      - ./analytics-service/migrations:/srv/migrations:ro
    command: python -m app.worker.consumer

  # health-service — gunluk saglik kaydi (ADR 0010).
  #
  # Kendi veritabani `health_db`. Su takibi burada; uyku ve kilo gecmisi ayni
  # desende eklenecek. Antrenman sorgu yolunda YER ALMIYOR, yani kimseye
  # gecikme eklemiyor — ADR 0010'un exercise-service reddinden ayrildigi nokta.
  health-service:
    build:
      context: ./health-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trainer}:${POSTGRES_PASSWORD:-trainer}@postgres:5432/health_db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: health-service
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    ports:
      # Gelistirmede gateway'i atlayarak test etmek icin. Uretimde KALDIRILIR.
      - "18004:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./health-service/app:/srv/app:ro
      - ./health-service/migrations:/srv/migrations:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # MinIO — motivasyon gonderisi fotograflari icin nesne deposu (ADR 0016).
  #
  # ★ AGA ACILMIYOR ★ Yalnizca social-service ic agdan (compose network)
  # konusuyor. Mobil istemci hicbir zaman MinIO'ya dogrudan gitmiyor — foto
  # `GET /v1/social/posts/{id}/photo` uzerinden, arkadaslik kontrolunden
  # gectikten sonra social-service tarafindan akitiliyor (docs/architecture/
  # overview.md'nin "tek public giris: api-gateway" kuralinin sonucu).
  #
  # Imaj: `minio/minio` Docker Hub'dan kaldirildi (2026-09, pull access denied);
  # ayni MinIO surumunun (2024.10.13) Bitnami arsiv imaji kullaniliyor. Bitnami
  # entrypoint'i sunucuyu kendisi baslatiyor (command yok), veri yolu
  # /bitnami/minio/data, surec uid 1001 ile calisiyor.
  minio:
    image: bitnamilegacy/minio:2024.10.13
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-trainer}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-trainer123}
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  # social-service — sosyal graf ve paylasim (ADR 0014).
  #
  # Kendi veritabani `social_db`. Kullanici adi/gorunen ad/avatar BURADA
  # yasiyor, `user_db`'de degil (ADR 0014, "Kullanici adi neden social_db'de").
  # `workout.session` topic'ini KENDI tuketici grubuyla (`social-workout-v1`)
  # dinliyor (Faz S3, `social-consumer` sureci) — workout-service bunun
  # varligini hic bilmiyor.
  social-service:
    build:
      context: ./social-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trainer}:${POSTGRES_PASSWORD:-trainer}@postgres:5432/social_db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: social-service
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: redpanda:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-trainer}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-trainer123}
      MINIO_BUCKET: social-photos
      MINIO_SECURE: "false"
    ports:
      # Gelistirmede gateway'i atlayarak test etmek icin. Uretimde KALDIRILIR.
      - "18006:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./social-service/app:/srv/app:ro
      - ./social-service/migrations:/srv/migrations:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # social-consumer — social-service'in IKINCI SURECI (Faz S3, aktif).
  #
  # `analytics-consumer` ile AYNI DESEN: `workout.session`'i kendi grubuyla
  # dinler, `workout_snapshots` projeksiyonunu besler. Ayrica silinen
  # kullanicilar icin `deleted_users` tombstone kontrolu yapar ve hata
  # dongusunde `consumer.seek()` ile offset'e geri sarar (bkz.
  # `app/worker/workout_consumer.py` basindaki not).
  social-consumer:
    build:
      context: ./social-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trainer}:${POSTGRES_PASSWORD:-trainer}@postgres:5432/social_db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: social-consumer
      KAFKA_BOOTSTRAP: redpanda:9092
      REPLAY_MODE: ${REPLAY_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    volumes:
      - ./social-service/app:/srv/app:ro
      - ./social-service/migrations:/srv/migrations:ro
    command: python -m app.worker.workout_consumer

  # chat-service — birebir mesajlasma + tek gercek zamanli tasima (ADR 0014).
  #
  # Kendi veritabani `chat_db`. WebSocket `/ws` ucu burada; sosyal
  # bildirimler de (Faz S6'dan itibaren) ayni soketten bu servis uzerinden
  # akiyor — social-service Redis'e yazar, chat-service iletir.
  chat-service:
    build:
      context: ./chat-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trainer}:${POSTGRES_PASSWORD:-trainer}@postgres:5432/chat_db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: chat-service
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      SOCIAL_SERVICE_URL: http://social-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      social-service:
        condition: service_started
    ports:
      # Gelistirmede gateway'i atlayarak test etmek icin. Uretimde KALDIRILIR.
      - "18007:8000"
    volumes:
      - ./chat-service/app:/srv/app:ro
      - ./chat-service/migrations:/srv/migrations:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # E-posta worker'ı — auth-service'in İKİNCİ SÜRECİ, ayrı servis değil.
  # Aynı imaj, aynı veritabanı, farklı entrypoint. ADR 0005 ayrı bir Notification
  # servisi kurulmayacağını söylüyor; bu onunla uyumlu.
  auth-email-worker:
    build:
      context: ./auth-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trainer}:${POSTGRES_PASSWORD:-trainer}@postgres:5432/auth_db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: auth-email-worker
      # SMTP ayarlari .env'den. Varsayilan Mailpit (yerel), gercek gonderim icin
      # .env'de smtp.gmail.com + uygulama sifresi verilir.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-AI Fitness Coach <no-reply@trainerasistant.local>}
      # Hesap silindiğinde diğer servislere haber vermek için (bkz. worker/fanout.py).
      USER_SERVICE_URL: http://user-service:8000
      WORKOUT_SERVICE_URL: http://workout-service:8000
      HEALTH_SERVICE_URL: http://health-service:8000
      ANALYTICS_SERVICE_URL: http://analytics-service:8000
      SOCIAL_SERVICE_URL: http://social-service:8000
      CHAT_SERVICE_URL: http://chat-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        # Şemayı auth-service'in migration'ı kuruyor; worker ondan sonra başlamalı.
        condition: service_started
      user-service:
        # Silme bildirimi buraya gidiyor. Ayakta olmaması ölümcül DEĞİL —
        # outbox satırı yeniden denenir — ama gereksiz hata log'u üretmesin.
        condition: service_started
      workout-service:
        condition: service_started
      analytics-service:
        condition: service_started
      social-service:
        condition: service_started
      chat-service:
        condition: service_started
    volumes:
      - ./auth-service/app:/srv/app:ro
    command: python -m app.worker.outbox_worker

  # api-gateway — nginx.
  #
  # Tek dis kapi. Yonlendirme, correlation ID, kaba hiz siniri ve —en onemlisi—
  # X-User-Id basliginin ISTEMCIDEN gelmesini engelleme.
  #
  # Arka servisler kimligi o baslikdan okuyup KENDILERI dogrulamiyor
  # (service-contract §2); istemci onu gonderebilseydi herkes istedigi kullanici
  # olabilirdi. Gateway basligi her istekte siliyor.
  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "18080:80"
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      workout-service:
        condition: service_started
      health-service:
        condition: service_started
      social-service:
        condition: service_started
      chat-service:
        condition: service_started
    volumes:
      # Gelistirmede yapilandirma degisikligi icin imaji yeniden derlemeye gerek yok:
      #   docker compose exec api-gateway nginx -s reload
      - ./api-gateway/conf.d:/etc/nginx/conf.d:ro

volumes:
  postgres-data:
  minio-data:
