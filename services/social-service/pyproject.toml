[project]
name = "social-service"
version = "1.0.0"
description = "AI Fitness Coach - sosyal graf ve paylasim servisi (ADR 0014)"
requires-python = ">=3.12"

# `health-service` ile AYNI temel kume:
#   - bcrypt / pyjwt YOK : bu servis credential tutmuyor, token dogrulamiyor.
#   - redis / aiokafka / minio / asyncpg YOK (ADR 0019): veri Firestore'da,
#     olaylar surec ici outbox dagiticisindan, fotograflar Firebase Storage'da,
#     hiz siniri surec icinde, bildirim sinyali Firestore dinleyicisinde.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-cloud-firestore>=2.19",
    # Firebase Storage (fotograf) + Auth — `nabiz_firebase.admin`.
    "firebase-admin>=6.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Motivasyon gonderisi fotograf yuklemesi icin multipart/form-data govde
    # ayristirmasi — FastAPI'nin UploadFile/Form'u calisma zamaninda bunu
    # gerektiriyor (ADR 0016).
    "python-multipart>=0.0.12",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
