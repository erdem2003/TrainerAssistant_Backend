[project]
name = "social-service"
version = "1.0.0"
description = "AI Fitness Coach - sosyal graf ve paylasim servisi (ADR 0014)"
requires-python = ">=3.12"

# `health-service` ile AYNI temel kume:
#   - bcrypt / pyjwt YOK : bu servis credential tutmuyor, token dogrulamiyor.
#                          Kimlik gateway'de dogrulaniyor (service-contract §2),
#                          buraya X-User-Id olarak geliyor.
#   - redis GEREKLI       : chat-service'e bildirim uyandirma sinyali gonderiyor
#                          (ADR 0014, "Redis pub/sub"). Faz S6'da kullanilacak,
#                          bagimlilik simdiden eklendi ki iki ayri PR gerekmesin.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.1",
    "aiokafka>=0.11",
    # Motivasyon gonderisi fotograf yuklemesi icin multipart/form-data govde
    # ayristirmasi — FastAPI'nin UploadFile/Form'u calisma zamaninda bunu
    # gerektiriyor (ADR 0016).
    "python-multipart>=0.0.12",
    # MinIO nesne deposu istemcisi — SENKRON bir SDK, bu yuzden app/storage.py
    # her cagriyi run_in_threadpool ile sarmali (ADR 0016).
    "minio>=7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
