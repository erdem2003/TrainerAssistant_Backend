[project]
name = "user-service"
version = "1.0.0"
description = "AI Fitness Coach - kullanici profili servisi"
requires-python = ">=3.12"

# auth-service'e gore DAHA AZ bagimlilik var ve bu bilincli:
#   - bcrypt / pyjwt YOK  : bu servis credential tutmuyor, token dogrulamiyor.
#                           Kimlik dogrulamasi gateway'de yapiliyor
#                           (service-contract §2), buraya X-User-Id olarak geliyor.
#   - redis YOK           : hiz siniri gateway'de. Profil uclari kaba kuvvet
#                           hedefi degil; Redis eklemek bakimi olan ama karsiligi
#                           olmayan bir bagimlilik olurdu.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-cloud-firestore>=2.19",
    "firebase-admin>=6.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    # AdMob SSV imza doğrulaması (app/ssv.py); firebase-admin zaten getiriyor.
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
