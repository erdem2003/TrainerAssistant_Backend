[project]
name = "auth-service"
version = "1.0.0"
description = "AI Fitness Coach - kimlik dogrulama servisi"
requires-python = ">=3.12"

# ADR 0019: kimlik Firebase Auth'ta — bcrypt / pyjwt / email-validator /
# redis / asyncpg kalkti. Kalan is: UUID<->uid eslemesi, /me, hesap silme
# fan-out'u (urllib, standart kutuphane) ve Firebase kullanicisinin silinmesi.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-cloud-firestore>=2.19",
    "firebase-admin>=6.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
