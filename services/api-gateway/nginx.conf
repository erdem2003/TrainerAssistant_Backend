# api-gateway — nginx
#
# ADR 0005: "Edge: routing, JWT dogrulama, rate limit, correlation ID"
#
# BU DOSYA YALNIZCA GLOBAL AYARLAR. Yonlendirme conf.d/ altinda.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Log bicimi correlation ID tasiyor (service-contract §10). Dagitik bir
    # sistemde bir istegi bastan sona izlemenin tek yolu bu.
    #
    # $correlation_id kullaniliyor, $http_x_correlation_id DEGIL: ikincisi
    # yalnizca ISTEMCININ gonderdigi degeri tasir. Istemci gondermediginde
    # gateway kendisi uretiyor (bkz. conf.d/gateway.conf) ve zincirin ILK
    # halkasi olan bu log satirinda o uretilen deger gorunmeli — yoksa
    # gateway'den gecen istek, arka servis loglarina baglanamaz.
    log_format json_combined escape=json
      '{"time":"$time_iso8601","correlation_id":"$correlation_id",'
      '"method":"$request_method","uri":"$uri","status":$status,'
      '"upstream":"$upstream_addr","duration_ms":$request_time,'
      '"bytes":$body_bytes_sent}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    keepalive_timeout  65;

    # Sunucu surumu gizlenir: saldirgana bilinen aciklari eslemek icin ipucu
    # vermenin bir faydasi yok.
    server_tokens off;

    # Hiz siniri BOLGELERI. Uygulanmasi conf.d/ icinde.
    # Auth uclari daha sikidir: kaba kuvvet en cok orada denenir.
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=120r/m;
    # WS icin AYRI bolge (ADR 0014): bir baglanti = bir istek, ama token her
    # 15 dakikada bir yenilendigi icin yeniden baglanma NORMAL bir davranis.
    # api_zone'a koymak, sohbet eden bir kullanicinin kendi REST isteklerini
    # 429'lamasi demekti.
    limit_req_zone $binary_remote_addr zone=ws_zone:10m rate=30r/m;
    limit_req_status 429;

    # WebSocket upgrade koprusu (ADR 0014). `'' close` bilincli: normal HTTP
    # isteginde Connection basligi BOS gitmeli (bkz. conf.d/proxy_common.inc),
    # yoksa upstream keepalive kirilir. Yalnizca gercek bir Upgrade istegi
    # geldiginde deger "upgrade" olur.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
