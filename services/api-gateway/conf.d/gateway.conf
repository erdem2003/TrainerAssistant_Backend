# Yonlendirme ve kimlik dogrulama.
#
# NGINX'IN ROLU:
#   - yonlendirme (hangi yol hangi servise)
#   - JWT DOGRULAMA (auth_request ile, asagida)
#   - correlation ID uretimi/korunmasi
#   - kaba hiz siniri
#   - X-User-Id ENJEKSIYONUNU ENGELLEME  ← guvenlik acisindan en kritigi
#
# NEDEN auth_request, NEDEN NGINX ICINDE JWT DOGRULAMA DEGIL:
# Standart nginx RS256 imzasi dogrulayamaz; OpenResty/njs gibi ucuncu parti
# modul derlemek gerekirdi. auth_request ile dogrulama, ozel anahtarin zaten
# bulundugu yerde — auth-service'te — kaliyor ve imaj standart kaliyor.
#
# BEDELI: her korumali istek bir ek alt-istek. Bu olcekte kabul edilebilir.
# Darbogaz olursa proxy_cache ile kisa sureli onbellek eklenir.

upstream auth_upstream {
    server auth-service:8000;
    keepalive 16;
}

upstream user_upstream {
    server user-service:8000;
    keepalive 16;
}

upstream workout_upstream {
    server workout-service:8000;
    keepalive 16;
}

upstream health_upstream {
    server health-service:8000;
    keepalive 16;
}

upstream analytics_upstream {
    server analytics-service:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # --- Correlation ID ---
    set $correlation_id $http_x_correlation_id;
    if ($correlation_id = "") {
        set $correlation_id $request_id;
    }

    # --- GUVENLIK: X-User-Id enjeksiyonunu engelle ---
    #
    # Arka servisler kimligi bu baslikdan okur ve KENDILERI DOGRULAMAZ
    # (service-contract §2). Istemcinin gonderebilmesi, herkesin istedigi
    # kullanici olabilmesi demekti.
    #
    # Bos string atamak, basligi upstream'e HIC gondermemek demektir. Korumali
    # location'lar bunu kendi icinde EZIP dogrulanmis degeri yaziyor.
    proxy_set_header X-User-Id "";
    proxy_set_header X-Email-Verified "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id  $correlation_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    add_header X-Correlation-Id $correlation_id always;

    # -----------------------------------------------------------------------
    # KORUMASIZ uclar — kimlik dogrulama icin token gerekmez
    # -----------------------------------------------------------------------
    # Giris yapabilmek icin once giris yapmis olmak gerekmez. Hiz siniri burada
    # daha siki: kaba kuvvet en cok bu uclarda denenir.
    location /v1/auth/registrations {
        limit_req zone=auth_zone burst=20 nodelay;
        proxy_pass http://auth_upstream;
    }

    location /v1/auth/sessions {
        limit_req zone=auth_zone burst=20 nodelay;
        proxy_pass http://auth_upstream;
    }

    # Parola sifirlama KORUMASIZ olmak zorunda: kullanici zaten giris
    # yapamadigi icin sifirliyor. Token istemek dongu olurdu.
    location /v1/auth/password-resets {
        limit_req zone=auth_zone burst=20 nodelay;
        proxy_pass http://auth_upstream;
    }

    # -----------------------------------------------------------------------
    # KORUMALI uclar — gecerli access token zorunlu
    # -----------------------------------------------------------------------
    # Desen: auth_request once /internal/verify-token'a alt-istek atar.
    #   2xx  -> istek gecer, donen X-User-Id upstream'e yazilir
    #   401  -> istek reddedilir, asagidaki @auth_error devreye girer
    #
    # `auth_request_set` alt-istegin YANIT BASLIGINDAN degeri aliyor
    # ($upstream_http_x_user_id), sonra proxy_set_header onu arka servise yaziyor.
    # Sunucu duzeyindeki bos atama bu satirlarla eziliyor.
    location = /v1/auth/me {
        auth_request     /internal/verify-token;
        auth_request_set $auth_user_id        $upstream_http_x_user_id;
        auth_request_set $auth_email_verified $upstream_http_x_email_verified;

        proxy_set_header X-User-Id        $auth_user_id;
        proxy_set_header X-Email-Verified $auth_email_verified;

        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://auth_upstream;
    }

    # Parola degistirme — token GEREKLI (ustelik mevcut parola da isteniyor).
    #
    # `location = /v1/auth/password` TAM ESLESME: /v1/auth/password-resets
    # yolunu yakalamamasi icin. Prefix eslesme olsaydi sifirlama ucu da
    # korumali hale gelir ve kullanici parolasini asla sifirlayamazdi.
    location = /v1/auth/password {
        auth_request     /internal/verify-token;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        proxy_set_header X-User-Id $auth_user_id;

        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://auth_upstream;
    }

    # Hesap silme — token + parola.
    location = /v1/auth/account {
        auth_request     /internal/verify-token;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        proxy_set_header X-User-Id $auth_user_id;

        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://auth_upstream;
    }

    # --- user-service: profil ---
    #
    # `location /v1/users` PREFIX eslesme (tam eslesme degil): su an yalnizca
    # /v1/users/me var ama ileride alt kaynaklar eklenecek ve hepsi ayni sekilde
    # korunmali. Yeni bir uc eklenip burada unutulursa KORUMASIZ kalmaz.
    location /v1/users {
        auth_request     /internal/verify-token;
        auth_request_set $auth_user_id        $upstream_http_x_user_id;
        auth_request_set $auth_email_verified $upstream_http_x_email_verified;

        proxy_set_header X-User-Id        $auth_user_id;
        proxy_set_header X-Email-Verified $auth_email_verified;

        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://user_upstream;
    }

    # user-service'in `/internal/...` uclari BURADA TANIMLI DEGIL ve olmamali.
    # Onlari yayinlamak, hesap silme ucunu internete acmak demekti. Yalnizca
    # compose agi icinden, auth-service'in worker'i tarafindan cagriliyorlar.

    # --- workout-service: antrenman kaydi ve gecmisi ---
    location /v1/workouts {
        auth_request     /internal/verify-token;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        proxy_set_header X-User-Id $auth_user_id;

        limit_req zone=api_zone burst=40 nodelay;

        # Antrenman govdesi setleri ve HER TEKRARI iceriyor; 100 tekrarlik uzun
        # bir oturum nginx'in 1 MB'lik varsayilanini zorlayabilir. Buyuk govde
        # sessizce 413 ile reddedilirse mobil taraf "neden kaydedilmedi"
        # sorusuyla kalir.
        client_max_body_size 4m;

        proxy_pass http://workout_upstream;
    }

    # --- workout-service: gunluk antrenman programi ---
    #
    # `/v1/workouts` ile ayni upstream: plan `exercises` katalogunu referans
    # aliyor ve tamamlanmasi antrenman kayitlarindan hesaplaniyor — ucu de ayni
    # servis veriyor (ADR 0005, database per service).
    #
    # `client_max_body_size` YOK: govde birkac plan kaleminden ibaret, antrenman
    # govdesi gibi her tekrari tasimiyor.
    location /v1/plan {
        auth_request     /internal/verify-token;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        proxy_set_header X-User-Id $auth_user_id;

        limit_req zone=api_zone burst=40 nodelay;

        proxy_pass http://workout_upstream;
    }

    # --- workout-service: gunluk toplamlar (Istatistik ekrani) ---
    #
    # Ileride `analytics-service`'e tasinacak (ADR 0006); o zaman yalnizca
    # `proxy_pass` hedefi degisecek, yol ayni kalacak.
    location /v1/stats {
        auth_request     /internal/verify-token;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        proxy_set_header X-User-Id $auth_user_id;

        limit_req zone=api_zone burst=40 nodelay;

        proxy_pass http://workout_upstream;
    }

    # --- health-service: gunluk saglik kaydi (ADR 0010) ---
    location /v1/sleep {
        auth_request     /internal/verify-token;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        proxy_set_header X-User-Id $auth_user_id;

        limit_req zone=api_zone burst=40 nodelay;

        proxy_pass http://health_upstream;
    }

    location /v1/water {
        auth_request     /internal/verify-token;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        proxy_set_header X-User-Id $auth_user_id;

        limit_req zone=api_zone burst=40 nodelay;

        proxy_pass http://health_upstream;
    }

    # --- user-service: vucut olcusu gecmisi (B6) + kisisel kalibrasyon (D1) ---
    location /v1/measurements {
        auth_request     /internal/verify-token;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        proxy_set_header X-User-Id $auth_user_id;

        limit_req zone=api_zone burst=40 nodelay;

        proxy_pass http://user_upstream;
    }

    location /v1/calibration {
        auth_request     /internal/verify-token;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        proxy_set_header X-User-Id $auth_user_id;

        limit_req zone=api_zone burst=40 nodelay;

        proxy_pass http://user_upstream;
    }

    # --- analytics-service: hata dagilimi (B1) + rozetler (A2) ---
    #
    # `/v1/analytics/daily` ile AYNI prefix ama BU IKISI ikinci bir kaynak
    # DEGIL — form_errors kirilimi ve rozetler workout-service'te hic yok,
    # yalnizca burada uretiliyor. `/v1/analytics/daily`'nin dogrulama-bekleyen
    # durumuyla karistirilmamali.
    location /v1/analytics {
        auth_request     /internal/verify-token;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        proxy_set_header X-User-Id $auth_user_id;

        limit_req zone=api_zone burst=40 nodelay;

        proxy_pass http://analytics_upstream;
    }

    # Egzersiz katalogu — KORUMASIZ, herkese ayni statik veri.
    # Kimlik istemek gereksiz: icinde kullaniciya ozel hicbir sey yok.
    location /v1/exercises {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://workout_upstream;
    }

    # -----------------------------------------------------------------------
    # Dogrulama alt-istegi
    # -----------------------------------------------------------------------
    location = /internal/verify-token {
        # `internal`: yalnizca nginx ici alt-isteklerden cagrilabilir.
        # Disaridan /internal/verify-token istegi 404 alir.
        internal;

        proxy_pass http://auth_upstream/v1/auth/introspect;

        # Alt-istek her zaman GET. Orijinal istek POST ise govdeyi tasimanin
        # anlami yok — dogrulama yalnizca Authorization basligina bakiyor.
        proxy_method            GET;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";

        # Gecersiz token loglanirken hangi ucta oldugu gorunsun.
        proxy_set_header        X-Original-URI $request_uri;
        proxy_set_header        X-Correlation-Id $correlation_id;
    }

    # -----------------------------------------------------------------------
    # Hata yanitlari — service-contract §3 bicimi
    # -----------------------------------------------------------------------
    # auth_request basarisiz oldugunda nginx varsayilan olarak BOS GOVDELI 401
    # doner. Istemcinin iki farkli hata bicimi ayristirmasi gerekmesin diye
    # sozlesme bicimine cevriliyor.
    error_page 401 = @auth_error;
    error_page 403 = @forbidden_error;

    location @auth_error {
        internal;
        default_type application/json;
        add_header X-Correlation-Id $correlation_id always;
        return 401 '{"error":{"code":"INVALID_TOKEN","message":"Oturum gecersiz, tekrar giris yap","details":{},"correlation_id":"$correlation_id"}}';
    }

    location @forbidden_error {
        internal;
        default_type application/json;
        add_header X-Correlation-Id $correlation_id always;
        return 403 '{"error":{"code":"FORBIDDEN","message":"Bu kaynaga erisim yetkin yok","details":{},"correlation_id":"$correlation_id"}}';
    }

    # -----------------------------------------------------------------------
    # Saglik
    # -----------------------------------------------------------------------
    location = /health/live {
        access_log off;
        return 200 '{"status":"ok","service":"api-gateway"}';
    }

    location = /health/auth {
        access_log off;
        proxy_pass http://auth_upstream/health/ready;
    }

    location = /health/user {
        access_log off;
        proxy_pass http://user_upstream/health/ready;
    }

    # analytics-service SAGLIK ucu yayinlaniyor ama /v1/analytics YAYINLANMIYOR.
    #
    # Gunluk toplamlari hala `workout-service` veriyor. Ikisini birden acmak,
    # ayni sayi icin IKI kaynak demekti ve biri digerinden saparsa hangisinin
    # dogru oldugu belirsizlesirdi. Gecis, analytics'in ayni ciktiyi urettigi
    # dogrulandiktan sonra tek satirlik bir `proxy_pass` degisikligi olacak.
    location = /health/analytics {
        proxy_pass http://analytics_upstream/health/ready;
    }

    location = /health/health {
        proxy_pass http://health_upstream/health/ready;
    }

    location = /health/workout {
        access_log off;
        proxy_pass http://workout_upstream/health/ready;
    }

    # --- Bilinmeyen yol ---
    location / {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Kaynak bulunamadi","details":{},"correlation_id":"$correlation_id"}}';
    }
}
