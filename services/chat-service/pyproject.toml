[project]
name = "chat-service"
version = "1.0.0"
description = "AI Fitness Coach - birebir mesajlasma + gercek zamanli tasima servisi (ADR 0014)"
requires-python = ">=3.12"

# `health-service` ile AYNI temel kume:
#   - bcrypt / pyjwt YOK : bu servis credential tutmuyor, token dogrulamiyor.
#                          Kimlik gateway'de dogrulaniyor (service-contract §2),
#                          buraya X-User-Id olarak geliyor. Soket omru icin de
#                          JWT cozmuyor — gateway'in zaten dogruladigi bitis
#                          zamanini X-Token-Exp basligindan okuyor (ADR 0014).
#   - redis / asyncpg YOK (ADR 0019): veri Firestore'da; mesaj/okundu/bildirim
#                          sinyali Firestore dinleyicisinde, canli rolenin hub'i
#                          tek surecte bellek ici.
#   - uvicorn[standard]   : websockets kutuphanesini birlikte getiriyor,
#                          ayri bir WS bagimliligi eklemeye gerek yok.
#   - httpx GEREKLI (Faz S6): social-service'e senkron dahili cagri
#                          (arkadaslik kontrolu + profil toplu cekimi) —
#                          app/social_client.py. Onceden yalnizca test
#                          bagimliligiydi, artik calisma-zamani bagimliligi.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-cloud-firestore>=2.19",
    "firebase-admin>=6.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
