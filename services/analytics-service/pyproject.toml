[project]
name = "analytics-service"
version = "1.0.0"
description = "AI Fitness Coach - olay akisindan turetilen okuma modeli (ADR 0006)"
requires-python = ">=3.12"

# Olaylar Kafka yerine workout-service'in Firestore outbox'indan, surec ici
# dagiticiyla geliyor (ADR 0019) — aiokafka kalkti.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-cloud-firestore>=2.19",
    "firebase-admin>=6.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
