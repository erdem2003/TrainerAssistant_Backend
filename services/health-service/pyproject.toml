[project]
name = "health-service"
version = "1.0.0"
description = "AI Fitness Coach - gunluk saglik kaydi servisi (ADR 0010)"
requires-python = ">=3.12"

# `user-service` ile AYNI bagimlilik kumesi ve ayni sebeple:
#   - bcrypt / pyjwt YOK : bu servis credential tutmuyor, token dogrulamiyor.
#                          Kimlik gateway'de dogrulaniyor (service-contract §2),
#                          buraya X-User-Id olarak geliyor.
#   - redis YOK          : hiz siniri gateway'de.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
